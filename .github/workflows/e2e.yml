name: E2E

# End-to-end tests that need no DigitalOcean account: the action talks to the
# mock API in test/mock-do-api.mjs instead.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs the action through `uses: ./`, so action.yml, outputs and the kubectl
  # download are exercised for real.
  mock-api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        version: ["latest", "1.33"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Test the code in this commit, not whatever dist/ was last committed.
      - run: npm run build

      - name: Start mock DigitalOcean API
        run: nohup node test/mock-do-api.mjs > mock-api.log 2>&1 &
      - name: Wait for mock API
        shell: bash
        run: |
          for _ in $(seq 1 30); do
            curl -sf -H "Authorization: Bearer test-token" http://127.0.0.1:8787/v2/kubernetes/clusters > /dev/null && exit 0
            sleep 1
          done
          cat mock-api.log; exit 1

      - uses: ./
        id: dokube
        env:
          DOKUBE_API_URL: http://127.0.0.1:8787/v2
        with:
          personalAccessToken: test-token
          clusterName: e2e-cluster
          expirationTime: "120"
          version: ${{ matrix.version }}

      - name: Verify
        shell: bash
        env:
          KUBECONFIG_OUTPUT: ${{ steps.dokube.outputs.kubeconfig }}
          CLUSTER_ID: ${{ steps.dokube.outputs.cluster-id }}
          KUBECTL_VERSION: ${{ steps.dokube.outputs.kubectl-version }}
        run: |
          set -euo pipefail
          echo "kubectl on PATH: $(command -v kubectl)"
          test "$KUBECONFIG" = "$KUBECONFIG_OUTPUT"
          test "$CLUSTER_ID" = "11111111-2222-3333-4444-555555555555"
          test "$(kubectl config current-context)" = "do-nyc1-e2e-cluster"
          client=$(kubectl version --client -o json | node -p 'JSON.parse(require("fs").readFileSync(0)).clientVersion.gitVersion')
          echo "kubectl client: $client"
          test "$client" = "v$KUBECTL_VERSION"
          if [ "${{ matrix.version }}" = "1.33" ]; then [[ "$KUBECTL_VERSION" == 1.33.* ]]; fi

  # Windows kills background processes when a step ends, so the mock can't live
  # in its own step. scripts/e2e.mjs hosts the mock in-process and runs
  # dist/index.js the way the runner does.
  windows:
    strategy:
      fail-fast: false
      matrix:
        version: ["latest", "1.33"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e
        env:
          E2E_KUBECTL_VERSION: ${{ matrix.version }}

  # Points the mock API at a real kind cluster and runs `kubectl get nodes`.
  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: helm/kind-action@v1
        with:
          cluster_name: dokube-e2e
      - run: npm run e2e:kind
